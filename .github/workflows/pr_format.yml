name: Check source for formatting

on:
  pull_request: {}

permissions:
  pull-requests: write

jobs:
  check_format:
    name: Check format and add comment to PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run format.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x "${GITHUB_WORKSPACE}/format.py"
          ${GITHUB_WORKSPACE}/format.py index.bs
          if ! diff index.bs index.bs-format > .pr_comment_diff; then
            echo "Action run ID ${{ github.run_id }} with format.py" > .pr_comment_text
            echo "Target commit SHA ${{ github.event.pull_request.head.sha }}" >> .pr_comment_text
            echo "" >> .pr_comment_text
            echo '```diff' >> .pr_comment_text
            cat .pr_comment_diff >> .pr_comment_text
            echo '```' >> .pr_comment_text
            gh pr comment ${{ github.event.number }} --body-file .pr_comment_text
          fi

